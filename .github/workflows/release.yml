name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build host binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          LDFLAGS="-s -w -X github.com/mpm/dworm/internal/version.Version=${VERSION} -X github.com/mpm/dworm/internal/version.Commit=${COMMIT} -X github.com/mpm/dworm/internal/version.Date=${DATE}"
          go build -ldflags="${LDFLAGS}" -o dworm ./cmd/dworm

      - name: Build endpoint binary
        run: |
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dworm_endpoint ./cmd/dworm_endpoint

      - name: Package release
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          ARCHIVE_NAME="dworm_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir -p dist/${ARCHIVE_NAME}
          cp dworm dist/${ARCHIVE_NAME}/
          cp dworm_endpoint dist/${ARCHIVE_NAME}/
          cp README.md LICENSE* dist/${ARCHIVE_NAME}/ 2>/dev/null || true
          cd dist
          tar -czvf ${ARCHIVE_NAME}.tar.gz ${ARCHIVE_NAME}
          sha256sum ${ARCHIVE_NAME}.tar.gz > ${ARCHIVE_NAME}.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dworm_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/*.tar.gz*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create checksums file
        run: |
          cd artifacts
          cat *.sha256 > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/checksums.txt
          generate_release_notes: true
